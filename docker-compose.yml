services:
  qr-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qr-studio
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
